<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The HTML Archives</title>
<style>
  :root {
    --beige: #f5f0e1;
    --beige-dark: #e8dfc8;
    --beige-darker: #d9cdb0;
    --paper: #fbf8ef;
    --ink: #3b3226;
    --ink-soft: #6d6151;
    --ink-faint: #8a7d67;
    --accent: #8a6d3b;
    --accent-dark: #6b5430;
    --danger: #8a3b32;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background-color: var(--beige);
    font-family: "Times New Roman", Times, serif;
    color: var(--ink);
  }
  .page { max-width: 1100px; margin: 0 auto; padding: 30px 24px 60px 24px; }
  header {
    text-align: center;
    border: 3px double var(--accent-dark);
    background-color: var(--paper);
    padding: 26px 16px;
    border-radius: 8px;
    margin-bottom: 24px;
    box-shadow: 0 2px 0 var(--beige-darker);
  }
  header h1 {
    margin: 0;
    font-family: "Times New Roman", Times, serif;
    font-size: 44px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  header p { margin: 10px 0 0 0; font-size: 16px; font-style: italic; color: var(--ink-soft); }

  .toolbar {
    border: 2px solid var(--accent-dark);
    background-color: var(--paper);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 24px;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  }
  .toolbar .spacer { flex: 1; }
  .btn {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    padding: 9px 18px;
    border: 2px solid var(--accent-dark);
    background-color: var(--beige-dark);
    color: var(--ink);
    border-radius: 6px;
    cursor: pointer;
  }
  .btn:hover { background-color: var(--beige-darker); }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background-color: var(--accent); color: #fff; }
  .btn-primary:hover { background-color: var(--accent-dark); }
  .btn-danger { border-color: var(--danger); color: var(--danger); }
  .btn-danger:hover { background-color: #f3e2df; }
  .btn-small { font-size: 13px; padding: 4px 10px; }
  .search-wrap { display: flex; align-items: center; gap: 8px; }
  .search-wrap input {
    font-family: "Times New Roman", Times, serif;
    font-size: 15px;
    padding: 7px 10px;
    border: 2px solid var(--accent-dark);
    border-radius: 5px;
    background-color: #fffdf7;
    color: var(--ink);
    width: 200px;
  }
  .stat { font-size: 15px; color: var(--ink-soft); font-style: italic; }
  .notice {
    display: none; margin: -10px 0 20px; padding: 11px 14px;
    border: 2px solid var(--danger); border-radius: 6px;
    background: #f8e9e6; color: var(--danger);
  }
  .notice.show { display: block; }

  .category {
    border: 2px solid var(--accent-dark);
    background-color: var(--paper);
    border-radius: 8px;
    margin-bottom: 22px;
    overflow: hidden;
  }
  .category-header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 16px;
    background-color: var(--beige-dark);
    border-bottom: 2px solid var(--accent-dark);
  }
  .category-header h2 { margin: 0; font-size: 24px; flex: 1; }
  .cards { display: flex; flex-wrap: wrap; gap: 14px; padding: 16px; }
  .card {
    width: 220px;
    border: 2px solid var(--accent-dark);
    background-color: var(--beige);
    border-radius: 6px;
    padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }
  .card[draggable="true"] { cursor: grab; }
  .card.dragging { opacity: 0.45; transform: scale(0.98); }
  .cards.drag-over { background: var(--beige-dark); outline: 2px dashed var(--accent); outline-offset: -4px; }
  .drag-hint { font-size: 12px; color: var(--ink-faint); font-style: italic; margin-left: auto; }
  .source-code {
    width: 100%; min-height: 60vh; resize: vertical;
    font-family: Consolas, "Courier New", monospace; font-size: 13px; line-height: 1.45;
    padding: 12px; border: 2px solid var(--accent-dark); border-radius: 5px;
    background: #fffdf7; color: var(--ink); tab-size: 2;
  }
  .source-title { word-break: break-word; }
  .card:hover {
    box-shadow: 0 4px 10px rgba(59, 50, 38, 0.25);
    transform: translateY(-2px);
  }
  .card .name { font-size: 17px; font-weight: bold; word-break: break-word; }
  .card .meta { font-size: 12px; color: var(--ink-soft); font-style: italic; }
  .card .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
  .empty {
    padding: 40px 16px;
    text-align: center;
    font-style: italic;
    color: var(--ink-faint);
    font-size: 17px;
    border: 2px dashed var(--beige-darker);
    border-radius: 8px;
    background-color: var(--paper);
  }
  .modal-backdrop {
    display: none; position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: rgba(59, 50, 38, 0.5);
    z-index: 100;
  }
  .modal-backdrop.open { display: block; }
  .modal {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 440px; max-width: 92vw; max-height: 88vh; overflow-y: auto;
    background-color: var(--beige);
    border: 3px double var(--accent-dark);
    border-radius: 10px;
    padding: 24px;
    z-index: 101;
    display: none;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
  }
  .modal.open { display: block; }
  .modal h3 { margin: 0 0 16px 0; font-size: 22px; text-align: center; }
  .modal label { display: block; font-size: 15px; margin: 12px 0 4px 0; }
  .modal input[type="text"], .modal select {
    width: 100%;
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    padding: 8px;
    border: 2px solid var(--accent-dark);
    border-radius: 5px;
    background-color: #fffdf7;
    color: var(--ink);
  }
  .source-picker {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 14px;
  }
  .source-option {
    display: flex !important; align-items: center; gap: 7px;
    margin: 0 !important; padding: 9px 10px;
    border: 2px solid var(--beige-darker); border-radius: 5px;
    background: var(--paper); cursor: pointer;
  }
  .source-option:has(input:checked) { border-color: var(--accent-dark); background: var(--beige-dark); }
  .source-panel[hidden] { display: none; }
  .modal textarea {
    width: 100%; min-height: 190px; resize: vertical;
    font-family: Consolas, "Courier New", monospace; font-size: 13px; line-height: 1.45;
    padding: 10px; border: 2px solid var(--accent-dark); border-radius: 5px;
    background: #fffdf7; color: var(--ink); tab-size: 2;
  }
  .field-help { margin: 5px 0 0; color: var(--ink-soft); font-size: 13px; font-style: italic; }
  .modal .file-name {
    font-size: 15px; font-style: italic; color: var(--ink-soft);
    margin-top: 4px; word-break: break-all;
  }
  .modal .button-row {
    display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px;
  }
  footer { text-align: center; font-size: 13px; color: var(--ink-faint); font-style: italic; margin-top: 30px; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>The HTML Archives</h1>
    <p>A collected library of HTML works, sorted at your leisure.</p>
  </header>

  <div class="toolbar">
    <button class="btn btn-primary" id="addFileBtn">+ Add HTML File</button>
    <button class="btn" id="addCategoryBtn">+ Add Category</button>
    <div class="spacer"></div>
    <div class="search-wrap">
      <label for="searchBox" style="font-size:15px; font-style:italic; color:var(--ink-soft);">Search</label>
      <input type="text" id="searchBox" placeholder="Filter by name&hellip;">
    </div>
    <span class="stat" id="stats"></span>
  </div>

  <div class="notice" id="notice" role="status" aria-live="polite"></div>
  <div id="archive" aria-live="polite"><div class="empty">Loading the archives&hellip;</div></div>

  <footer>The HTML Archives &middot; securely stored online, shared by every device</footer>
</div>

<div class="modal-backdrop" id="sourceBackdrop"></div>
<div class="modal" id="sourceModal">
  <h3 class="source-title" id="sourceTitle">HTML Source</h3>
  <textarea class="source-code" id="sourceCode" readonly spellcheck="false"></textarea>
  <div class="button-row">
    <button class="btn" id="sourceClose">Close</button>
  </div>
</div>

<div class="modal-backdrop" id="fileBackdrop"></div>
<div class="modal" id="fileModal">
  <h3>Add HTML File</h3>
  <div class="source-picker" role="radiogroup" aria-label="HTML source">
    <label class="source-option"><input type="radio" name="sourceMode" value="upload" checked> Upload a file</label>
    <label class="source-option"><input type="radio" name="sourceMode" value="paste"> Paste HTML</label>
  </div>
  <div class="source-panel" id="uploadPanel">
    <label for="fileInput">Choose an .html file</label>
    <input type="file" id="fileInput" accept=".html,.htm,text/html">
    <div class="file-name" id="fileChosen"></div>
  </div>
  <div class="source-panel" id="pastePanel" hidden>
    <label for="htmlText">Paste your HTML code</label>
    <textarea id="htmlText" spellcheck="false" placeholder="<!doctype html>&#10;<html>&#10;  <body>...</body>&#10;</html>"></textarea>
    <p class="field-help">The code needs at least one recognizable HTML element.</p>
  </div>
  <label for="fileName">Name it whatever you like</label>
  <input type="text" id="fileName" placeholder="e.g. My Cool Page">
  <label for="fileCategory">Sort into category</label>
  <select id="fileCategory"></select>
  <div class="button-row">
    <button class="btn" id="fileCancel">Cancel</button>
    <button class="btn btn-primary" id="fileSave">Add to Archive</button>
  </div>
</div>

<div class="modal-backdrop" id="catBackdrop"></div>
<div class="modal" id="catModal">
  <h3>Add Category</h3>
  <label for="categoryName">Category name</label>
  <input type="text" id="categoryName" placeholder="e.g. Games">
  <div class="button-row">
    <button class="btn" id="catCancel">Cancel</button>
    <button class="btn btn-primary" id="catSave">Create Category</button>
  </div>
</div>

<div class="modal-backdrop" id="moveBackdrop"></div>
<div class="modal" id="moveModal">
  <h3 id="moveTitle">Move File</h3>
  <label for="moveCategory">Move to category</label>
  <select id="moveCategory"></select>
  <div class="button-row">
    <button class="btn" id="moveCancel">Cancel</button>
    <button class="btn btn-primary" id="moveSave">Move File</button>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var pendingFile = null;
  var sourceMode = "upload";
  var allCategories = [];
  var moveFileId = null;
  var searchTerm = "";

  function showError(message) {
    $("notice").textContent = message;
    $("notice").classList.add("show");
  }

  function clearError() {
    $("notice").classList.remove("show");
    $("notice").textContent = "";
  }

  // ---- Talk to the server (shared storage) ----
  function api(method, path, body) {
    return fetch(path, {
      method: method,
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined
    }).then(function (res) {
      return res.text().then(function (text) {
        var data;
        try { data = text ? JSON.parse(text) : {}; }
        catch (e) { data = {}; }
        if (!res.ok) throw new Error(data.error || "Request failed (" + res.status + ")");
        return data;
      });
    });
  }

  function matchesSearch(file) {
    if (!searchTerm) return true;
    return file.name.toLowerCase().indexOf(searchTerm) !== -1;
  }

  function render() {
    api("GET", "/api/state").then(function (state) {
      clearError();
      var categories = state.categories;
      var files = state.files;
      allCategories = categories;

      categories.sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });
      files.sort(function (a, b) {
        var ac = a.categoryId === null ? 0 : a.categoryId;
        var bc = b.categoryId === null ? 0 : b.categoryId;
        if (ac !== bc) return ac - bc;
        return (a.sortOrder || 0) - (b.sortOrder || 0);
      });

      var shown = files.filter(matchesSearch);
      $("stats").textContent = shown.length + " shown / " + files.length + " file" +
        (files.length === 1 ? "" : "s") + " in " + categories.length + " categor" +
        (categories.length === 1 ? "y" : "ies");

      var container = $("archive");
      container.innerHTML = "";

      if (categories.length === 0 && files.length === 0) {
        var empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "The archives are empty. Add a category, then add an HTML file to begin.";
        container.appendChild(empty);
        return;
      }

      if (searchTerm && shown.length === 0) {
        var noMatch = document.createElement("div");
        noMatch.className = "empty";
        noMatch.textContent = 'No files match "' + searchTerm + '".';
        container.appendChild(noMatch);
        return;
      }

      var uncategorized = shown.filter(function (f) {
        return !categories.some(function (c) { return c.id === f.categoryId; });
      });

      categories.forEach(function (cat) {
        var catFiles = shown.filter(function (f) { return f.categoryId === cat.id; });
        if (catFiles.length === 0 && searchTerm) return; // hide empty cats while searching

        var section = document.createElement("div");
        section.className = "category";

        var header = document.createElement("div");
        header.className = "category-header";
        var h2 = document.createElement("h2");
        h2.textContent = cat.name;
        header.appendChild(h2);
        var count = catFiles.length;
        var countSpan = document.createElement("span");
        countSpan.className = "stat";
        countSpan.textContent = count + " file" + (count === 1 ? "" : "s");
        header.appendChild(countSpan);
        var hint = document.createElement("span");
        hint.className = "drag-hint";
        hint.textContent = "Drag files to organize";
        header.appendChild(hint);
        var delCat = document.createElement("button");
        delCat.className = "btn btn-small btn-danger";
        delCat.textContent = "Delete";
        delCat.title = "Delete this category (its files become Uncategorized)";
        delCat.onclick = function () {
          if (confirm('Delete category "' + cat.name + '"? Its files will be kept as Uncategorized.')) {
            api("DELETE", "/api/categories/" + cat.id).then(render).catch(alert);
          }
        };
        header.appendChild(delCat);
        section.appendChild(header);

        var cards = document.createElement("div");
        cards.className = "cards";
        setupDropZone(cards, cat.id);
        if (catFiles.length === 0) {
          var e = document.createElement("div");
          e.className = "empty";
          e.style.width = "100%";
          e.style.padding = "20px";
          e.textContent = "No files in this category yet. Drop a file here to move it.";
          cards.appendChild(e);
        } else {
          catFiles.forEach(function (f) { cards.appendChild(makeCard(f, categories)); });
        }
        section.appendChild(cards);
        container.appendChild(section);
      });

      if (uncategorized.length > 0) {
        var sec = document.createElement("div");
        sec.className = "category";
        var head = document.createElement("div");
        head.className = "category-header";
        var h = document.createElement("h2");
        h.textContent = "Uncategorized";
        head.appendChild(h);
        var uc = document.createElement("span");
        uc.className = "stat";
        uc.textContent = uncategorized.length + " file" + (uncategorized.length === 1 ? "" : "s");
        head.appendChild(uc);
        sec.appendChild(head);
        var c = document.createElement("div");
        c.className = "cards";
        setupDropZone(c, null);
        uncategorized.forEach(function (f) { c.appendChild(makeCard(f, categories)); });
        sec.appendChild(c);
        container.appendChild(sec);
      }
    }).catch(function (err) {
      $("archive").innerHTML = '<div class="empty">The archives could not be loaded. Please refresh and try again.</div>';
      showError("Could not load the archive: " + err.message);
    });
  }

  function fmtSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / 1048576).toFixed(1) + " MB";
  }

  function makeCard(file, categories) {
    var card = document.createElement("div");
    card.className = "card";
    card.draggable = true;
    card.dataset.fileId = String(file.id);
    card.addEventListener("dragstart", function (e) {
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", String(file.id));
    });
    card.addEventListener("dragend", function () {
      card.classList.remove("dragging");
      document.querySelectorAll(".cards.drag-over").forEach(function (zone) { zone.classList.remove("drag-over"); });
    });

    var name = document.createElement("div");
    name.className = "name";
    name.textContent = file.name;
    card.appendChild(name);

    var meta = document.createElement("div");
    meta.className = "meta";
    var cat = categories.filter(function (c) { return c.id === file.categoryId; })[0];
    meta.textContent = (cat ? cat.name : "Uncategorized") + " \u2014 " + fmtSize(file.size);
    card.appendChild(meta);

    var actions = document.createElement("div");
    actions.className = "actions";

    var openBtn = document.createElement("button");
    openBtn.className = "btn btn-primary btn-small";
    openBtn.textContent = "Preview";
    openBtn.title = "Open this HTML in a new tab";
    openBtn.onclick = function () {
      previewFile(file);
    };
    actions.appendChild(openBtn);

    var sourceBtn = document.createElement("button");
    sourceBtn.className = "btn btn-small";
    sourceBtn.textContent = "Source";
    sourceBtn.title = "View this HTML's individual source code";
    sourceBtn.onclick = function () { showSource(file); };
    actions.appendChild(sourceBtn);

    var moveBtn = document.createElement("button");
    moveBtn.className = "btn btn-small";
    moveBtn.textContent = "Move";
    moveBtn.onclick = function () { openMoveModal(file); };
    actions.appendChild(moveBtn);

    var renameBtn = document.createElement("button");
    renameBtn.className = "btn btn-small";
    renameBtn.textContent = "Rename";
    renameBtn.onclick = function () {
      var newName = prompt("Rename this file:", file.name);
      if (newName && newName.trim()) {
        api("PUT", "/api/files/" + file.id, { name: newName.trim() })
          .then(render).catch(function (e) { alert("Could not rename: " + e); });
      }
    };
    actions.appendChild(renameBtn);

    var delBtn = document.createElement("button");
    delBtn.className = "btn btn-small btn-danger";
    delBtn.textContent = "Delete";
    delBtn.onclick = function () {
      if (confirm('Delete "' + file.name + '" from the archive?')) {
        api("DELETE", "/api/files/" + file.id).then(render).catch(alert);
      }
    };
    actions.appendChild(delBtn);

    card.appendChild(actions);
    return card;
  }

  function showSource(file) {
    $("sourceTitle").textContent = "HTML Source — " + file.name;
    $("sourceCode").value = "Loading…";
    $("sourceBackdrop").classList.add("open");
    $("sourceModal").classList.add("open");
    fetch("/api/files/" + file.id + "/source", { cache: "no-store" })
      .then(function (response) {
        if (!response.ok) throw new Error("Source code could not be loaded.");
        return response.text();
      })
      .then(function (html) { $("sourceCode").value = html; })
      .catch(function (err) { $("sourceCode").value = "Error: " + err.message; });
  }

  function closeSourceModal() {
    $("sourceBackdrop").classList.remove("open");
    $("sourceModal").classList.remove("open");
  }
  $("sourceClose").onclick = closeSourceModal;
  $("sourceBackdrop").onclick = closeSourceModal;

  function setupDropZone(zone, categoryId) {
    zone.addEventListener("dragover", function (e) {
      if (searchTerm) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      zone.classList.add("drag-over");
    });
    zone.addEventListener("dragleave", function (e) {
      if (!zone.contains(e.relatedTarget)) zone.classList.remove("drag-over");
    });
    zone.addEventListener("drop", function (e) {
      if (searchTerm) return;
      e.preventDefault();
      zone.classList.remove("drag-over");
      var id = Number(e.dataTransfer.getData("text/plain"));
      if (!id) return;
      var dragged = document.querySelector('[data-file-id="' + id + '"]');
      if (!dragged || dragged.parentElement !== zone) {
        // Cross-category drop: first move the file, then refresh.
        api("PUT", "/api/files/" + id, { categoryId: categoryId })
          .then(function () { render(); })
          .catch(function (err) { showError("Could not move file: " + err.message); });
        return;
      }
      var target = e.target.closest(".card");
      if (target && target !== dragged && target.parentElement === zone) {
        var rect = target.getBoundingClientRect();
        var before = e.clientX < rect.left + rect.width / 2;
        zone.insertBefore(dragged, before ? target : target.nextSibling);
      }
      var ids = Array.prototype.map.call(zone.querySelectorAll(".card"), function (el) { return Number(el.dataset.fileId); });
      api("PUT", "/api/files/" + id + "/reorder", { categoryId: categoryId, fileIds: ids })
        .then(function () { render(); })
        .catch(function (err) { showError("Could not save the new order: " + err.message); render(); });
    });
  }

  function previewFile(file) {
    var preview = window.open("about:blank", "_blank");
    if (!preview) {
      showError("The preview tab was blocked. Allow pop-ups for this site and try again.");
      return;
    }
    fetch("/api/files/" + file.id + "/preview", { cache: "no-store" })
      .then(function (response) {
        if (!response.ok) throw new Error("Preview could not be loaded.");
        return response.text();
      })
      .then(function (html) {
        var previewDocument = preview.document;
        previewDocument.title = file.name;
        previewDocument.documentElement.style.cssText = "width:100%;height:100%;margin:0";
        previewDocument.body.style.cssText = "width:100%;height:100%;margin:0;overflow:hidden";
        var frame = previewDocument.createElement("iframe");
        frame.setAttribute("sandbox", "allow-scripts allow-forms allow-modals allow-popups");
        frame.setAttribute("title", file.name + " preview");
        frame.style.cssText = "display:block;width:100%;height:100%;border:0";
        frame.srcdoc = html;
        previewDocument.body.replaceChildren(frame);
      })
      .catch(function (err) {
        preview.close();
        showError(err.message);
      });
  }

  function looksLikeHtml(content) {
    return !/\u0000/.test(content) && /<(?:html|head|body|title|meta|link|style|script|main|section|article|aside|header|footer|nav|div|span|p|h[1-6]|a|img|picture|video|audio|canvas|svg|form|input|button|label|select|textarea|table|ul|ol|li|br|hr)\b[^>]*>/i.test(content);
  }

  // ---- File modal ----
  function fillCategorySelect(select, currentId) {
    select.innerHTML = "";
    var unc = document.createElement("option");
    unc.value = "";
    unc.textContent = "Uncategorized";
    if (currentId === null || currentId === undefined) unc.selected = true;
    select.appendChild(unc);
    allCategories.forEach(function (c) {
      var o = document.createElement("option");
      o.value = String(c.id);
      o.textContent = c.name;
      if (currentId === c.id) o.selected = true;
      select.appendChild(o);
    });
  }

  function openFileModal() {
    pendingFile = null;
    sourceMode = "upload";
    document.querySelector('input[name="sourceMode"][value="upload"]').checked = true;
    $("fileInput").value = "";
    $("htmlText").value = "";
    $("fileName").value = "";
    $("fileChosen").textContent = "";
    fillCategorySelect($("fileCategory"), null);
    updateSourceMode();
    $("fileBackdrop").classList.add("open");
    $("fileModal").classList.add("open");
  }

  function closeFileModal() {
    $("fileBackdrop").classList.remove("open");
    $("fileModal").classList.remove("open");
  }

  $("addFileBtn").onclick = openFileModal;
  $("fileCancel").onclick = closeFileModal;
  $("fileBackdrop").onclick = closeFileModal;

  function updateSourceMode() {
    var selected = document.querySelector('input[name="sourceMode"]:checked');
    sourceMode = selected ? selected.value : "upload";
    $("uploadPanel").hidden = sourceMode !== "upload";
    $("pastePanel").hidden = sourceMode !== "paste";
  }
  Array.prototype.forEach.call(document.querySelectorAll('input[name="sourceMode"]'), function (radio) {
    radio.addEventListener("change", function () {
      updateSourceMode();
      if (sourceMode === "paste") $("htmlText").focus();
    });
  });

  $("fileInput").onchange = function () {
    var f = $("fileInput").files[0];
    if (!f) return;
    if (!/\.html?$/i.test(f.name)) {
      pendingFile = null;
      $("fileInput").value = "";
      $("fileChosen").textContent = "";
      alert("Please choose an .html or .htm file.");
      return;
    }
    if (f.size > 2 * 1024 * 1024) {
      pendingFile = null;
      $("fileInput").value = "";
      $("fileChosen").textContent = "";
      alert("HTML files must be 2 MB or smaller.");
      return;
    }
    pendingFile = f;
    $("fileChosen").textContent = "Selected: " + f.name;
    if (!$("fileName").value) {
      $("fileName").value = f.name.replace(/\.(html?|HTML?)$/, "");
    }
  };

  $("fileSave").onclick = function () {
    if (sourceMode === "upload" && !pendingFile) { alert("Please choose an .html file first."); return; }
    var pastedHtml = $("htmlText").value;
    if (sourceMode === "paste" && !looksLikeHtml(pastedHtml)) {
      alert("Paste HTML code containing at least one recognizable HTML element.");
      $("htmlText").focus();
      return;
    }
    var name = $("fileName").value.trim();
    if (!name) { alert("Please give the file a name."); return; }
    var catVal = $("fileCategory").value;
    var categoryId = catVal ? Number(catVal) : null;
    var saveButton = $("fileSave");
    saveButton.disabled = true;
    saveButton.textContent = "Adding…";

    function saveContent(content) {
      api("POST", "/api/files", {
        name: name,
        categoryId: categoryId,
        content: content
      }).then(function () {
        closeFileModal();
        render();
      }).catch(function (err) {
        alert("Could not save file: " + err);
      }).finally(function () {
        saveButton.disabled = false;
        saveButton.textContent = "Add to Archive";
      });
    }

    if (sourceMode === "paste") {
      saveContent(pastedHtml);
      return;
    }

    var reader = new FileReader();
    reader.onload = function () {
      if (!looksLikeHtml(String(reader.result))) {
        saveButton.disabled = false;
        saveButton.textContent = "Add to Archive";
        alert("That file does not appear to contain recognizable HTML code.");
        return;
      }
      saveContent(reader.result);
    };
    reader.onerror = function () {
      saveButton.disabled = false;
      saveButton.textContent = "Add to Archive";
      alert("Could not read that file.");
    };
    reader.readAsText(pendingFile);
  };

  // ---- Category modal ----
  function openCatModal() {
    $("categoryName").value = "";
    $("catBackdrop").classList.add("open");
    $("catModal").classList.add("open");
    $("categoryName").focus();
  }
  function closeCatModal() {
    $("catBackdrop").classList.remove("open");
    $("catModal").classList.remove("open");
  }
  $("addCategoryBtn").onclick = openCatModal;
  $("catCancel").onclick = closeCatModal;
  $("catBackdrop").onclick = closeCatModal;

  $("catSave").onclick = function () {
    var name = $("categoryName").value.trim();
    if (!name) { alert("Please enter a category name."); return; }
    api("POST", "/api/categories", { name: name })
      .then(function () { closeCatModal(); render(); })
      .catch(function (err) { alert("Could not create category: " + err); });
  };
  $("categoryName").addEventListener("keydown", function (e) {
    if (e.key === "Enter") $("catSave").click();
  });

  // ---- Move modal ----
  function openMoveModal(file) {
    moveFileId = file.id;
    $("moveTitle").textContent = 'Move "' + file.name + '"';
    fillCategorySelect($("moveCategory"), file.categoryId);
    $("moveBackdrop").classList.add("open");
    $("moveModal").classList.add("open");
  }
  function closeMoveModal() {
    $("moveBackdrop").classList.remove("open");
    $("moveModal").classList.remove("open");
    moveFileId = null;
  }
  $("moveCancel").onclick = closeMoveModal;
  $("moveBackdrop").onclick = closeMoveModal;
  $("moveSave").onclick = function () {
    if (moveFileId === null) return;
    var catVal = $("moveCategory").value;
    var categoryId = catVal ? Number(catVal) : null;
    api("PUT", "/api/files/" + moveFileId, { categoryId: categoryId })
      .then(function () { closeMoveModal(); render(); })
      .catch(function (e) { alert("Could not move: " + e); });
  };

  // ---- Search ----
  $("searchBox").addEventListener("input", function () {
    searchTerm = $("searchBox").value.trim().toLowerCase();
    render();
  });

  render();
})();
</script>
</body>
</html>
